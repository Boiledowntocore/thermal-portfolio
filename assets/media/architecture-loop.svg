<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="478" viewBox="0 82 1000 478" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="aA" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#16181a"/></marker>
    <marker id="aC" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#16181a"/></marker>
    <marker id="aG" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#82878c"/></marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e9ebec" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1000" height="560" fill="url(#grid)"/>

  <!-- legend -->
  <g font-family="ui-monospace, monospace" font-size="11" fill="#82878c">
    <line x1="720" y1="104" x2="748" y2="104" stroke="#16181a" stroke-width="3"/><text x="754" y="108">warm coolant</text>
    <line x1="720" y1="122" x2="748" y2="122" stroke="#16181a" stroke-width="3" stroke-dasharray="11 6"/><text x="754" y="126">chilled coolant</text>
    <line x1="720" y1="140" x2="748" y2="140" stroke="#82878c" stroke-width="3"/><text x="754" y="144">heat &#8594; air</text>
    <line x1="720" y1="158" x2="748" y2="158" stroke="#16181a" stroke-width="1.4" stroke-dasharray="4 3"/><text x="754" y="162">control / CAN</text>
  </g>

  <!-- coolant racetrack: amber Pack->Chiller, cyan Chiller->Pack -->
  <path d="M 440 150 H 560 A 60 60 0 0 1 620 210 V 236" fill="none" stroke="#16181a" stroke-width="3" marker-end="url(#aA)"/>
  <path d="M 620 336 V 380 A 60 60 0 0 1 560 440 H 320 A 60 60 0 0 1 260 380 V 210 A 60 60 0 0 1 320 150 H 372" fill="none" stroke="#16181a" stroke-width="3" stroke-dasharray="11 6" marker-end="url(#aC)"/>
  <!-- flow chevrons -->
  <path d="M 540 143 l 9 7 l -9 7" fill="none" stroke="#16181a" stroke-width="2.4"/>
  <path d="M 627 350 l -7 9 l -7 -9" fill="none" stroke="#16181a" stroke-width="2.4"/>
  <path d="M 360 447 l -9 -7 l 9 -7" fill="none" stroke="#16181a" stroke-width="2.4"/>
  <path d="M 253 250 l 7 -9 l 7 9" fill="none" stroke="#16181a" stroke-width="2.4"/>

  <text x="440" y="316" font-family="ui-monospace, monospace" font-size="11" fill="#82878c" text-anchor="middle">50/50 glycol&#8211;water</text>

  <!-- refrigerant heat to air -->
  <path d="M 712 250 H 762" fill="none" stroke="#82878c" stroke-width="3" marker-end="url(#aG)"/>
  <path d="M 918 250 H 950" fill="none" stroke="#82878c" stroke-width="3" marker-end="url(#aG)"/>
  <text x="915" y="352" font-family="ui-monospace, monospace" font-size="11" fill="#82878c" text-anchor="end">to ambient ~50 &#176;C</text>

  <!-- nodes -->
  <g>
    <rect x="365" y="108" width="150" height="84" rx="10" fill="#ffffff" stroke="#16181a" stroke-width="1.6"/>
    <text x="378" y="132" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.5" fill="#16181a">LOAD</text>
    <text x="378" y="154" font-size="16" font-weight="600" fill="#16181a">Battery pack</text>
    <text x="378" y="174" font-size="11.5" fill="#82878c">Q&#775; from energy balance</text>
  </g>
  <g>
    <rect x="365" y="398" width="150" height="84" rx="10" fill="#ffffff" stroke="#16181a" stroke-width="1.6"/>
    <text x="378" y="422" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.5" fill="#16181a">P1</text>
    <text x="378" y="444" font-size="16" font-weight="600" fill="#16181a">Coolant pump</text>
    <text x="378" y="464" font-size="11.5" fill="#82878c">flow sized to &#916;T</text>
  </g>
  <g>
    <rect x="545" y="225" width="150" height="112" rx="10" fill="#ffffff" stroke="#16181a" stroke-width="1.6"/>
    <text x="558" y="249" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.5" fill="#16181a">CHILLER</text>
    <text x="558" y="271" font-size="16" font-weight="600" fill="#16181a">Refrigeration</text>
    <text x="558" y="289" font-size="11.5" fill="#82878c">exchanger + circuit</text>
    <text x="558" y="309" font-size="11.5" fill="#82878c">COP &gt; 2.5 target</text>
  </g>
  <g>
    <rect x="185" y="238" width="150" height="74" rx="10" fill="#ffffff" stroke="#16181a" stroke-width="1.6"/>
    <text x="198" y="262" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.5" fill="#16181a">PTC</text>
    <text x="198" y="284" font-size="16" font-weight="600" fill="#16181a">Coolant heater</text>
    <text x="198" y="303" font-size="11.5" fill="#82878c">heating mode</text>
  </g>
  <!-- radiator / fan -->
  <g>
    <rect x="762" y="176" width="156" height="148" rx="10" fill="#ffffff" stroke="#16181a" stroke-width="1.6"/>
    <g transform="translate(840,250)">
      <circle r="46" fill="#ffffff" stroke="#16181a" stroke-width="1.5"/>
      <g stroke="#c7cbce" stroke-width="1.3" fill="none"><circle r="37"/><circle r="24"/><circle r="12"/></g>
      <g fill="none" stroke="#16181a" stroke-width="1.25">
        <path d="M0 0C13 -5 24 -2 31 -13C18 -13 7 -11 0 0Z"/>
        <path d="M0 0C13 -5 24 -2 31 -13C18 -13 7 -11 0 0Z" transform="rotate(120)"/>
        <path d="M0 0C13 -5 24 -2 31 -13C18 -13 7 -11 0 0Z" transform="rotate(240)"/>
      </g>
    </g>
    <text x="840" y="312" font-size="11.5" fill="#82878c" text-anchor="middle">Radiator + fan</text>
  </g>

  <!-- ECU control bus -->
  <g stroke="#16181a" stroke-width="1.3" stroke-dasharray="4 3" opacity="0.5" fill="none">
    <path d="M 440 482 V 500"/><path d="M 260 312 V 500"/><path d="M 620 337 V 500"/><path d="M 840 324 V 500"/>
    <path d="M 240 500 H 860"/>
  </g>
  <rect x="150" y="500" width="700" height="44" rx="10" fill="#ffffff" stroke="#16181a" stroke-width="1.5"/>
  <text x="170" y="521" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.5" fill="#16181a">ECU</text>
  <text x="170" y="536" font-size="12.5" fill="#16181a">Thermal ECU &#183; CAN 2.0 &#183; cooling / self-circulation / heating / standby</text>

  <text x="40" y="118" font-family="ui-monospace, monospace" font-size="11" fill="#82878c">operating range &#8722;10 to 55 &#176;C</text>
</svg>
