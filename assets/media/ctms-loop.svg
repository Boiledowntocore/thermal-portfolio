<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="478" viewBox="0 82 1000 478" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="aA" class="mk mk--hot" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#c62f1e"/></marker>
    <marker id="aC" class="mk mk--cold" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#1f6fb2"/></marker>
    <marker id="aG" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#82878c"/></marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e9ebec" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1000" height="560" fill="url(#grid)"/>

  <!-- legend -->
  <g font-family="ui-monospace, monospace" font-size="11" fill="#82878c">
    <line x1="720" y1="104" x2="748" y2="104" stroke="#c62f1e" stroke-width="3"/><text x="754" y="108">warm coolant</text>
    <line x1="720" y1="122" x2="748" y2="122" stroke="#1f6fb2" stroke-width="3"/><text x="754" y="126">cooled coolant</text>
    <line x1="720" y1="140" x2="748" y2="140" stroke="#82878c" stroke-width="3"/><text x="754" y="144">heat &#8594; air</text>
    <line x1="720" y1="158" x2="748" y2="158" stroke="#1f6fb2" stroke-width="1.4" stroke-dasharray="4 3"/><text x="754" y="162">control / CAN</text>
  </g>

  <!-- flow: rectifier -> pumps -> radiator -> return -->
  <path class="flow flow--hot" d="M 250 214 H 322" fill="none" stroke="#c62f1e" stroke-width="3" marker-end="url(#aA)"/>
  <path class="flow flow--hot" d="M 470 214 H 560" fill="none" stroke="#c62f1e" stroke-width="3" marker-end="url(#aA)"/>
  <path class="flow flow--cold" d="M 640 300 V 356 H 160 V 250" fill="none" stroke="#1f6fb2" stroke-width="3" marker-end="url(#aC)"/>
  <path d="M 396 363 l -9 -7 l 9 -7" fill="none" stroke="#1f6fb2" stroke-width="2.4"/>

  <!-- heat to air -->
  <path d="M 640 150 V 120" fill="none" stroke="#82878c" stroke-width="3" marker-end="url(#aG)"/>
  <text x="640" y="110" font-family="ui-monospace, monospace" font-size="11" fill="#82878c" text-anchor="middle">to ambient air</text>

  <!-- rectifier stage -->
  <g>
    <rect x="70" y="168" width="180" height="92" rx="10" fill="#ffffff" stroke="#16181a" stroke-width="1.6"/>
    <text x="86" y="192" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.5" fill="#c62f1e">SOURCE</text>
    <text x="86" y="214" font-size="16" font-weight="600" fill="#16181a">Rectifier stage</text>
    <text x="86" y="234" font-size="11.5" fill="#82878c">power-electronics</text>
    <text x="86" y="251" font-size="11.5" fill="#82878c">heat load</text>
  </g>

  <!-- pump bank -->
  <rect x="322" y="150" width="148" height="196" rx="12" fill="none" stroke="#c7cbce" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="396" y="168" font-family="ui-monospace, monospace" font-size="10.5" letter-spacing="1.5" fill="#82878c" text-anchor="middle">REDUNDANT</text>
  <g font-size="13.5" font-weight="600" fill="#16181a" font-family="ui-monospace, monospace">
    <rect x="334" y="178" width="124" height="44" rx="8" fill="#ffffff" stroke="#16181a" stroke-width="1.4"/><text x="396" y="205" text-anchor="middle">Pump 1</text>
    <rect x="334" y="228" width="124" height="44" rx="8" fill="#ffffff" stroke="#16181a" stroke-width="1.4"/><text x="396" y="255" text-anchor="middle">Pump 2</text>
    <rect x="334" y="278" width="124" height="44" rx="8" fill="#ffffff" stroke="#16181a" stroke-width="1.4"/><text x="396" y="305" text-anchor="middle">Pump 3</text>
  </g>
  <text x="396" y="338" font-size="10.5" fill="#82878c" text-anchor="middle" font-family="ui-monospace, monospace">single-fault tolerant</text>

  <!-- radiator stage -->
  <g>
    <rect x="560" y="150" width="160" height="150" rx="10" fill="#ffffff" stroke="#16181a" stroke-width="1.6"/>
    <text x="574" y="174" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.5" fill="#1f6fb2">RAD</text>
    <g transform="translate(640,224)">
      <circle r="40" fill="#ffffff" stroke="#16181a" stroke-width="1.5"/>
      <g stroke="#c7cbce" stroke-width="1.3" fill="none"><circle r="32"/><circle r="21"/><circle r="10"/></g>
      <g class="fan" fill="none" stroke="#16181a" stroke-width="1.25"><circle r="34" fill="none" stroke="none"/>
        <path d="M0 0C11 -4 21 -2 27 -11C16 -11 6 -9 0 0Z"/>
        <path d="M0 0C11 -4 21 -2 27 -11C16 -11 6 -9 0 0Z" transform="rotate(120)"/>
        <path d="M0 0C11 -4 21 -2 27 -11C16 -11 6 -9 0 0Z" transform="rotate(240)"/>
      </g>
    </g>
    <text x="640" y="286" font-size="11.5" fill="#82878c" text-anchor="middle">Radiator + fan stage</text>
  </g>

  <text x="640" y="326" font-family="ui-monospace, monospace" font-size="11" fill="#82878c" text-anchor="middle">air-matched to peak duty</text>

  <!-- controllers -->
  <g stroke="#1f6fb2" stroke-width="1.3" stroke-dasharray="4 3" opacity="0.55" fill="none">
    <path d="M 300 468 H 360"/>
    <path d="M 520 456 V 346"/><path d="M 520 456 V 356 H 396 V 346"/>
    <path d="M 560 456 H 640 V 300"/>
  </g>
  <g>
    <rect x="120" y="440" width="180" height="60" rx="10" fill="#ffffff" stroke="#16181a" stroke-width="1.5"/>
    <text x="136" y="462" font-family="ui-monospace, monospace" font-size="10.5" letter-spacing="1.4" fill="#82878c">REQUESTS</text>
    <text x="136" y="484" font-size="14.5" font-weight="600" fill="#16181a">Charger controller</text>
  </g>
  <path d="M 300 470 H 356" fill="none" stroke="#1f6fb2" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#aC)"/>
  <text x="328" y="462" font-size="10" fill="#82878c" text-anchor="middle" font-family="ui-monospace, monospace">cooling</text>
  <g>
    <rect x="360" y="440" width="180" height="60" rx="10" fill="#ffffff" stroke="#16181a" stroke-width="1.5"/>
    <text x="376" y="462" font-family="ui-monospace, monospace" font-size="10.5" letter-spacing="1.4" fill="#1f6fb2">DELIVERS</text>
    <text x="376" y="484" font-size="14.5" font-weight="600" fill="#16181a">Thermal ECU</text>
  </g>

  <text x="40" y="118" font-family="ui-monospace, monospace" font-size="11" fill="#82878c">degassing on pump suction</text>
</svg>
